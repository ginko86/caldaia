<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1D16">
<meta name="description" content="Turni di carico, sacchi di pellet e informazioni sulla caldaia di casa Solaroli.">
<title>Caldaia Casa Solaroli</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<style>
:root{
  --carta:#FBF7F2; --scheda:#FFFFFF; --inchiostro:#1F1A17; --tenue:#6B625B; --linea:#E8DFD5;
  --fuoco:#C2410C; --fuoco-chiaro:#FFEDD5; --brace:#2B1D16;
  --ok:#15803D; --ok-chiaro:#DCFCE7; --avviso:#B45309; --avviso-chiaro:#FEF3C7; --errore:#B91C1C; --errore-chiaro:#FEE2E2;
  --ombra:0 1px 2px rgba(43,29,22,.06),0 4px 14px rgba(43,29,22,.06);
  --raggio:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --carta:#15110E; --scheda:#211B17; --inchiostro:#F4EEE8; --tenue:#B3A89E; --linea:#3A312A;
    --fuoco:#FB923C; --fuoco-chiaro:#3B2416; --brace:#0E0B09;
    --ok:#4ADE80; --ok-chiaro:#12301E; --avviso:#FBBF24; --avviso-chiaro:#33280F; --errore:#F87171; --errore-chiaro:#3A1717;
    --ombra:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px;scroll-padding-bottom:110px}
body{margin:0;background:var(--carta);color:var(--inchiostro);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.15rem;margin-bottom:10px}
h3{font-size:1rem;margin:14px 0 6px}
p{margin:6px 0}
a{color:var(--fuoco)}
.nascosto{display:none!important}

/* Testata */
.testata{position:sticky;top:0;z-index:20;background:var(--brace);color:#FFF7ED;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px}
.testata h1{font-size:1.2rem;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
.testata h1 img{width:28px;height:28px;border-radius:7px}
.stato-rete{font-size:.78rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.stato-rete.offline{background:#7C2D12}
.stato-rete.attesa{background:#92400E}
.icona-btn{background:none;border:0;color:inherit;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icona-btn:active{background:rgba(255,255,255,.12)}
.icona-btn svg{width:26px;height:26px}
.gira svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

main{max-width:640px;margin:0 auto;padding:6px 14px 20px}

/* Schede */
.scheda{background:var(--scheda);border-radius:var(--raggio);padding:16px;margin:12px 0;box-shadow:var(--ombra);border:1px solid var(--linea)}
.tenue{color:var(--tenue)}
.piccolo{font-size:.85rem}
.riga{display:flex;align-items:center;gap:10px}
.riga.spazio{justify-content:space-between}

/* Avvisi in alto */
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--fuoco-chiaro)}
.banner.avviso{background:var(--avviso-chiaro)}
.banner.errore{background:var(--errore-chiaro)}
.banner.ok{background:var(--ok-chiaro)}
.banner .testo{flex:1}
.banner b{display:block}

/* Turno corrente */
.turno-ora{border-radius:var(--raggio);padding:18px 18px 16px;margin:12px 0;color:#fff;background:var(--c,#888);position:relative;overflow:hidden}
.turno-ora .etichetta{font-size:.9rem;opacity:.92}
.turno-ora .nome{font-size:2.2rem;font-weight:800;letter-spacing:-.01em;margin:2px 0}
.turno-ora .date{font-size:1rem;opacity:.95}
.turno-ora .tuo{display:inline-block;margin-top:10px;background:rgba(255,255,255,.95);color:var(--inchiostro);font-weight:700;border-radius:999px;padding:4px 12px;font-size:.9rem}

/* Carico */
.scelta{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 14px}
.scelta button{height:58px;border-radius:14px;border:2px solid var(--linea);background:var(--carta);font-size:1.5rem;font-weight:700;cursor:pointer}
.scelta button[aria-pressed="true"]{border-color:var(--fuoco);background:var(--fuoco);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--linea);
  background:var(--scheda);font-weight:650;cursor:pointer;padding:10px 14px;text-align:center}
.btn:active{transform:scale(.99)}
.btn.primario{background:var(--fuoco);border-color:var(--fuoco);color:#fff}
.btn.grande{min-height:72px;font-size:1.35rem;border-radius:18px}
.btn.piccolo{min-height:42px;font-size:.95rem;width:auto;padding:6px 14px;border-radius:12px}
.btn.pericolo{color:var(--errore);border-color:var(--errore-chiaro)}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .btn{flex:1}

.lista{list-style:none;margin:6px 0 0;padding:0}
.lista li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linea)}
.lista li:first-child{border-top:0}
.lista .ora{font-variant-numeric:tabular-nums;color:var(--tenue);min-width:3.2em}
.lista .cresce{flex:1}
.lista b{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700;color:#fff;background:var(--c,#888)}
.etic{display:inline-block;border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:650;background:var(--carta);border:1px solid var(--linea);color:var(--tenue)}
.etic.attesa{background:var(--avviso-chiaro);border-color:transparent;color:var(--avviso)}

/* Serbatoio sacchi */
.serbatoio{height:22px;border-radius:999px;background:var(--carta);border:1px solid var(--linea);overflow:hidden;margin:10px 0 6px}
.serbatoio div{height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.serbatoio.basso div{background:var(--avviso)}
.serbatoio.critico div{background:var(--errore)}
.numerone{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.griglia2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cella{background:var(--carta);border-radius:14px;padding:12px}
.cella .val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}

/* Turni */
.selettore{display:flex;background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:4px;gap:4px}
.selettore button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font-weight:650;cursor:pointer}
.selettore button[aria-pressed="true"]{background:var(--scheda);box-shadow:var(--ombra);color:var(--fuoco)}
.spunta{display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer}
.spunta input{width:24px;height:24px;accent-color:var(--fuoco)}
.settimana{display:flex;align-items:stretch;gap:12px;padding:10px 0;border-top:1px solid var(--linea)}
.settimana:first-child{border-top:0}
.settimana .barra{width:8px;border-radius:6px;background:var(--c)}
.settimana.previsto .barra{background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 10px)}
.settimana .corpo{flex:1;min-width:0}
.settimana .quando{font-weight:700}
.settimana .chi{font-size:1.1rem}
.settimana.corrente{background:var(--fuoco-chiaro);border-radius:12px;padding:10px;margin:2px -10px;border-top:0}
.settimana.passata{opacity:.55}
.settimana .azioni{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}

.mese-testa{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mese-testa b{font-size:1.1rem;text-transform:capitalize}
.calendario{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendario .gs{font-size:.75rem;text-align:center;color:var(--tenue);padding-bottom:2px}
.calendario .g{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:650;
  font-variant-numeric:tabular-nums;position:relative;background:var(--carta);font-size:.95rem}
.calendario .g.fuori{opacity:.3}
.calendario .g.oggi{outline:3px solid var(--inchiostro);outline-offset:-3px}
.calendario .g small{font-size:.6rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.legenda{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.campo{display:block;margin:10px 0}
.campo span{display:block;font-size:.9rem;color:var(--tenue);margin-bottom:4px}
.campo input,.campo select{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--linea);background:var(--carta);padding:8px 12px}
.campi2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.campo input{min-width:0}

/* Pagina caldaia */
details{border-top:1px solid var(--linea)}
details:first-of-type{border-top:0}
summary{cursor:pointer;padding:14px 4px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2.5px solid var(--tenue);border-bottom:2.5px solid var(--tenue);transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
.contenuto{padding:0 4px 14px}
.codice{display:grid;grid-template-columns:4.2em 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--linea)}
.codice:first-child{border-top:0}
.codice code{font:700 1rem/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--brace);color:#FDBA74;border-radius:8px;padding:6px 4px;text-align:center;align-self:start;letter-spacing:.04em}
.codice .chi-fa{font-size:.82rem;font-weight:700;margin-top:4px}
.chi-fa.tu{color:var(--ok)} .chi-fa.fra{color:var(--avviso)}
table.dati{width:100%;border-collapse:collapse;font-size:.95rem}
table.dati td{padding:7px 4px;border-top:1px solid var(--linea);vertical-align:top}
table.dati td:last-child{text-align:right;font-weight:650}

/* Navigazione */
.schede-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--scheda);border-top:1px solid var(--linea);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.schede-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.8rem;font-weight:650;color:var(--tenue);cursor:pointer}
.schede-nav button svg{width:26px;height:26px}
.schede-nav button[aria-current="page"]{color:var(--fuoco);background:var(--fuoco-chiaro)}

/* Messaggi */
#toast{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{max-width:560px;width:100%;background:var(--inchiostro);color:var(--carta);border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;animation:sale .25s ease-out}
.toast.ok{background:var(--ok);color:#fff} .toast.errore{background:var(--errore);color:#fff} .toast.avviso{background:#92400E;color:#fff}
@keyframes sale{from{transform:translateY(12px);opacity:0}}
.velo{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.finestra{background:var(--scheda);border-radius:22px;padding:20px;width:100%;max-width:520px;margin-bottom:env(safe-area-inset-bottom);animation:sale .2s ease-out;max-height:90vh;overflow:auto}
.finestra h2{font-size:1.3rem}
.attesa-velo{position:fixed;inset:0;z-index:60;background:rgba(20,14,10,.35);display:grid;place-items:center}
.attesa-velo div{background:var(--scheda);border-radius:16px;padding:16px 22px;font-weight:650;display:flex;gap:12px;align-items:center}
.rotella{width:22px;height:22px;border-radius:50%;border:3px solid var(--linea);border-top-color:var(--fuoco);animation:gira .8s linear infinite}
.scelta.due{grid-template-columns:1fr 1fr}
.scelta.due button{font-size:1.05rem;height:64px}
.scelta.giorni{grid-template-columns:repeat(4,1fr)}
.scelta.giorni button{font-size:1rem;height:64px;line-height:1.15}
.scelta.giorni button small{display:block;font-size:.72rem;font-weight:600;opacity:.8}
.scelta button[disabled]{opacity:.35}
.oggi-carica{background:rgba(255,255,255,.95);color:var(--inchiostro);border-radius:12px;padding:8px 12px;margin-top:10px;font-weight:600}
.scelta.tre{grid-template-columns:repeat(3,1fr)}
.scelta.cinque{grid-template-columns:repeat(5,1fr)}
.griglia3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.griglia3 .cella{padding:10px;min-width:0;overflow-wrap:anywhere}
.griglia3 .val{font-size:1.4rem}
.cella-btn{border:2px solid var(--linea);text-align:left;font:inherit;color:inherit;cursor:pointer}
.cella-btn[aria-expanded="true"]{border-color:var(--fuoco)}
.scelta.cinque button{height:52px;font-size:1.3rem}
.scelta.tre button{font-size:1rem;height:64px;line-height:1.15}
.scelta.tre button small{display:block;font-size:.75rem;font-weight:600;opacity:.8}
.campo input.numero{font-size:2.2rem;font-weight:800;text-align:center;min-height:72px}
.link-btn{background:none;border:0;color:var(--fuoco);font-weight:650;text-decoration:underline;padding:12px 2px 2px;cursor:pointer;width:100%;text-align:center}
.errore-finestra{color:var(--errore);font-weight:650;min-height:1.2em;margin-top:6px}
.btn.mini{min-height:36px;font-size:.85rem;width:auto;padding:4px 10px;border-radius:10px}
.vuoto{text-align:center;padding:30px 10px}
ol.passi{margin:4px 0 0;padding-left:24px}
ol.passi li{padding:5px 0}
.prove{margin-top:14px;padding-top:12px;border-top:1px solid var(--linea)}
.vuoto img{width:84px;height:84px;border-radius:20px}
/* 1.6 – pulizia */
.semaforo{border-radius:var(--raggio);padding:14px 16px;margin:12px 0;background:var(--avviso-chiaro);border:2px solid var(--avviso);display:flex;gap:12px;align-items:flex-start}
.semaforo .luce{width:22px;height:22px;border-radius:50%;background:#EAB308;flex:none;margin-top:3px;box-shadow:0 0 0 4px rgba(234,179,8,.25)}
.semaforo b{display:block;font-size:1.1rem}
.verde-piccolo{font-size:.9rem;color:var(--tenue);margin:-4px 2px 8px;display:flex;align-items:center;gap:8px}
.verde-piccolo i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.passo{background:var(--carta);border-radius:14px;padding:12px;margin-top:12px}
.passo .btn{margin-top:10px}
.fonte{font-size:.75rem;color:var(--tenue);margin-top:6px}
.scelta.notti{grid-template-columns:repeat(3,1fr)}
.scelta.notti button{height:70px;font-size:1rem;line-height:1.15}
.scelta.notti button small{display:block;font-size:.78rem;font-weight:600;opacity:.85}
.scelta.cassetto{grid-template-columns:repeat(3,1fr)}
.scelta.cassetto button,.scelta.giudizio button{height:52px;font-size:.98rem}
.scelta.giudizio{grid-template-columns:repeat(3,1fr)}
.scelta.giudizio4{grid-template-columns:repeat(4,1fr)}
.scelta.giudizio4 button{height:52px;font-size:.88rem}
.voce-man{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linea)}
.voce-man:first-child{border-top:0}
.voce-man .cresce{flex:1;min-width:0}
/* 1.7 – sbancalamento */
.sbanc{border:2px solid var(--fuoco)}
.sbanc.consigliata{border-color:var(--linea)}
.sbanc .testa{display:flex;align-items:flex-start;gap:10px}
.sbanc .testa h2{flex:1;margin:0}
.chiudi{background:none;border:0;color:var(--tenue);font-size:1.3rem;line-height:1;width:40px;height:40px;border-radius:10px;cursor:pointer}
.giorni-sb{list-style:none;margin:8px 0 0;padding:0}
.giorni-sb li{padding:9px 0;border-top:1px solid var(--linea)}
.giorni-sb li:first-child{border-top:0}
.giorni-sb .fasce{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:4px}
.giorni-sb .fascia{background:var(--carta);border-radius:10px;padding:6px 8px;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.giorni-sb .fascia.piove{opacity:.55}
.giorni-sb .fascia b{display:block;font-size:.78rem;color:var(--tenue);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.passi-sb{counter-reset:p;list-style:none;margin:10px 0 0;padding:0}
.passi-sb>li{counter-increment:p;background:var(--carta);border-radius:14px;padding:12px 12px 12px 48px;margin-top:10px;position:relative}
.passi-sb>li::before{content:counter(p);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--fuoco);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.passi-sb>li.fatto::before{content:"✓";background:var(--ok)}
.passi-sb .campo{margin:8px 0 0}
.passi-sb .btn{margin-top:8px}
.quota{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.chi{font-size:.92rem}
.scelta.risposta{grid-template-columns:1fr 1fr}
.scelta.risposta button{height:60px;font-size:1rem;line-height:1.15}
.scelta.risposta button small{display:block;font-size:.74rem;font-weight:600;opacity:.85}
.giorno-risp{margin:14px 0 4px;font-weight:700}
.giorno-risp .etic{margin-left:6px}
</style>
</head>
<body>
<header class="testata">
  <h1><img src="icona-192.png" alt="">Caldaia</h1>
  <span id="statoRete" class="stato-rete nascosto"></span>
  <button class="icona-btn" id="btnAggiorna" data-az="aggiorna" aria-label="Aggiorna">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icona-btn" data-az="vai" data-p="impostazioni" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="pagina"></main>

<nav class="schede-nav" id="nav">
  <button data-az="vai" data-p="oggi">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Oggi</button>
  <button data-az="vai" data-p="turni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Turni</button>
  <button data-az="vai" data-p="pellet">

function chiedi({ titolo, testo = '', si = 'Conferma', no = 'Annulla', pericolo = false, html = '', valida = null }) {
  return new Promise(ok => {

        const premuti = [...g.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.valore);
        if ('multi' in g.dataset) o[g.dataset.gruppo] = premuti;      // scelta multipla
        else if (premuti.length) o[g.dataset.gruppo] = premuti[0];

      return o;
    };

    const aggiornaVisibili = () => {
      const o = valori();
      m.querySelectorAll('[data-mostra-se]').forEach(el => {
        const [gr, val] = el.dataset.mostraSe.split('=');
        const prima = el.classList.contains('nascosto');
        el.classList.toggle('nascosto', o[gr] !== val);
        const campo = el.querySelector('input');
        if (prima && o[gr] === val && campo) setTimeout(() => campo.focus(), 50);
      });
    };
    m.querySelector('.velo').addEventListener('click', e => {
      const v = e.target.closest('[data-valore]');
      if (v) {
        const g = v.closest('[data-gruppo]') || m;
        if ('multi' in g.dataset) v.setAttribute('aria-pressed', String(v.getAttribute('aria-pressed') !== 'true'));
        else g.querySelectorAll('[data-valore]').forEach(x => x.setAttribute('aria-pressed', String(x === v)));

async function chiama(url, init = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let r, testo;
  try {
    r = await fetch(url, { ...init, signal: ctrl.signal, redirect: 'follow', cache: 'no-store' });
    testo = await r.text();
  } catch (e) {
    const err = new Error('Nessuna connessione'); err.rete = true; throw err;
  } finally { clearTimeout(timer); }
  try { return JSON.parse(testo); }
  catch (e) {
    const err = new Error(r.ok ? 'Lo script ha risposto in modo strano. Avvisa Francesco.' : 'Errore del server (' + r.status + '). Riprova tra poco.');
    err.rete = !r.ok; throw err;
  }
}
const apiStato = c => chiama(API + '?codice=' + encodeURIComponent(c) + '&t=' + Date.now());
const apiAzione = (c, azione, params = {}) => chiama(API, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita il controllo CORS preliminare
  body: JSON.stringify({ ...params, codice: c, azione })
});

function impostaStato(r) {

}

async function aggiorna({ silenzioso = false } = {}) {

    if (!inviati || !S) {

      if (r.ok) impostaStato(r); else mostraErrore(r.errore);
    }
    senzaRete = false;
  } catch (e) {
    senzaRete = !!e.rete;
    if (!silenzioso) toast(e.rete ? 'Niente campo: ti mostro gli ultimi dati salvati.' : e.message, e.rete ? 'avviso' : 'errore', 4500);
  } finally {
    inCaricamento = false;
    disegna();
  }
}

async function azioneOnline(azione, params, msgOk) {

    else toast(e.message, 'errore', 5000);
    return null;
  } finally { attesa(false); disegna(); }
}

/* =====================================================================
 *  CODA DEI CARICHI (funziona anche senza campo)
 *  Ogni carico ha un identificativo: se arriva due volte, lo script
 *  lo registra una volta sola.

const coda = () => ls.get(K.coda, []);
const salvaCoda = q => ls.set(K.coda, q);

function accoda(op) {
  salvaCoda(coda().concat([op]));
  disegna();
  return svuotaCoda();
}
function svuotaCoda() {
  if (svuotando) return svuotando;
  svuotando = (async () => {
    let inviati = 0;
    for (;;) {
      const q = coda();
      if (!q.length) break;
      const op = q[0];
      const params = { id: op.id, quando: op.quando };
      if (op.sacchi != null) params.sacchi = op.sacchi;   // carico, prelievo e conta
      if (op.per) params.per = op.per;                     // prelievo: per chi
      if (op.nota) params.nota = op.nota;
      if (op.extra) Object.assign(params, op.extra);       // 1.6: azioni della pulizia
      let r;
      try { r = await apiAzione(op.codice, op.azione, params); }
      catch (e) { if (e.rete) senzaRete = true; break; }
      if (!r.ok) {
        // problemi passeggeri: si riprova più tardi
        if (/lock|timeout|tempo|riprova|servizio|service|quota|codice/i.test(r.errore || '')) break;
        erroriCoda[op.id] = r.errore;
        toast('Non registrato (' + descrOp(op) + '): ' + r.errore, 'errore', 7000);
      } else {
        inviati++;
        senzaRete = false;
        if (op.codice === codice() && r.io) impostaStato(r);
      }
      salvaCoda(coda().filter(o => o.id !== op.id));
    }
    return inviati;
  })().finally(() => { svuotando = null; disegna(); });
  return svuotando;
}

function descrOp(op) {
  const ora = ' alle ' + oraLocale(new Date(op.quando));
  if (DESCR_PULIZIA[op.azione]) return DESCR_PULIZIA[op.azione] + ora;
  if (op.azione === 'carico') return sacchiTesto(op.sacchi) + ora;
  if (op.azione === 'prelievo') return sacchiTesto(op.sacchi) + ' per ' + op.per + ora;
  if (op.azione === 'conta') return 'conta dei sacchi' + ora;
  return 'pallet';
}

/* Stato "come sarà": quello del server più i carichi ancora in coda */
function vista() {
  if (!S) return null;
  const v = JSON.parse(JSON.stringify(S));
  const oggi = oggiK();
  if (v.oggi !== oggi) v.carichiOggi = [];   // dati di un altro giorno
  const q = coda().filter(o => o.codice === codice()).sort((a, b) => a.quando.localeCompare(b.quando));
  for (const o of q) {
    if (o.azione === 'carico') {
      v.sacchi.locale -= o.sacchi;
      const d = new Date(o.quando);
      if (chiaveLocale(d) === oggi) v.carichiOggi.push({ ora: oraLocale(d), persona: o.chi, sacchi: o.sacchi, attesa: true, opId: o.id });
    } else if (o.azione === 'prelievo') {
      v.sacchi.locale -= o.sacchi;
      const t = (v.portatiVia = v.portatiVia || []).find(x => x.per === o.per);
      if (t) t.sacchi += o.sacchi; else v.portatiVia.push({ per: o.per, sacchi: o.sacchi });
    } else if (o.azione === 'sbancalato') {
      v.sacchi.locale += v.sacchiPerPallet || 70;
      v.sacchi.pallet -= 1;
    } else if (o.azione === 'conta') {
      v.sacchi.locale = o.sacchi;
    } else if (DESCR_PULIZIA[o.azione] && v.pulizia && !v.pulizia.errore) {
      applicaPuliziaInCoda(v.pulizia, o);                  // 1.6
    }
  }
  if (v.sacchi.media > 0) v.sacchi.giorniRestanti = Math.round(v.sacchi.locale / v.sacchi.media * 10) / 10;
  v.carichiOggi.sort((a, b) => a.ora.localeCompare(b.ora));
  return v;
}

let fb = null;
async function caricaFirebase() {
  if (fb) return fb;
  const [app, m] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-messaging.js')]);
  if (!(await m.isSupported())) throw new Error('Questo browser non supporta le notifiche. Apri l\'app con Chrome.');
  const messaging = m.getMessaging(app.initializeApp(firebaseConfig));
  // App aperta: la notifica arriva qui invece che nella tendina
  m.onMessage(messaging, async p => {
    const titolo = (p.notification && p.notification.title) || (p.data && p.data.titolo) || 'Caldaia';
    const testo = (p.notification && p.notification.body) || (p.data && p.data.testo) || '';

    aggiorna({ silenzioso: true });

}
function statoNotifiche() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return 'no';
  if (Notification.permission === 'granted') return ls.get(K.token) && ls.get(K.tokenCod) === codice() ? 'attive' : 'da-registrare';
  return Notification.permission; // default | denied
}
async function attivaNotifiche({ chiedendo = false, forza = false } = {}) {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) throw new Error('Questo browser non supporta le notifiche. Apri l\'app con Chrome.');
  let perm = Notification.permission;
  if (perm === 'default' && chiedendo) perm = await Notification.requestPermission();
  if (perm !== 'granted') return perm;
  const reg = await navigator.serviceWorker.ready;
  const { m, messaging } = await caricaFirebase();
  const token = await m.getToken(messaging, { vapidKey: VAPID, serviceWorkerRegistration: reg });
  if (!token) throw new Error('Firebase non ha dato il permesso. Riprova.');
  const scaduto = Date.now() - ls.get(K.tokenOra, 0) > 7 * 864e5;
  if (forza || scaduto || token !== ls.get(K.token) || ls.get(K.tokenCod) !== codice()) {
    const r = await apiAzione(codice(), 'registraNotifiche', { token });
    if (!r.ok) throw new Error(r.errore);
    ls.set(K.token, token); ls.set(K.tokenOra, Date.now()); ls.set(K.tokenCod, codice());
  }
  return 'granted';
}
async function bottoneNotifiche() {
  attesa(true, 'Attivo le notifiche…');
  try {
    const r = await attivaNotifiche({ chiedendo: true, forza: true });
    if (r === 'granted') toast('Notifiche attive ✓', 'ok');
    else if (r === 'denied') toast('Le notifiche sono bloccate: guarda le istruzioni nelle Impostazioni.', 'avviso', 6000);
  } catch (e) {
    toast(e.message && !/fetch|network/i.test(e.message) ? e.message : 'Serve internet per attivare le notifiche.', 'errore', 6000);
  } finally { attesa(false); disegna(); }
}

/* =====================================================================
 *  DISEGNO DELLE PAGINE
 * ===================================================================== */
function disegnaTestata() {
  const el = $('#statoRete');
  const n = coda().length;
  el.className = 'stato-rete';
  if (n) { el.textContent = n + ' da inviare'; el.classList.add('attesa'); }
  else if (senzaRete) { el.textContent = 'senza campo'; el.classList.add('offline'); }
  else el.classList.add('nascosto');
  $('#btnAggiorna').classList.toggle('gira', inCaricamento);
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.p === pagina ? 'page' : 'false'));
  $('#nav').classList.toggle('nascosto', !S);
}

function disegna() {
  disegnaTestata();
  const main = $('#pagina');
  if (!codice()) { main.innerHTML = paginaCodice(); return; }
  if (!S) {
    main.innerHTML = `<div class="vuoto"><img src="icona-192.png" alt=""><h2 style="margin-top:14px">Carico i dati…</h2>
      <p class="tenue">${senzaRete ? 'Serve internet la prima volta che apri l\'app.' : 'Un attimo.'}</p>
      ${senzaRete ? '<button class="btn primario" data-az="aggiorna">Riprova</button>' : ''}</div>`;
    return;
  }
  const v = vista();
  const f = { oggi: paginaOggi, turni: paginaTurni, pellet: paginaPellet, pulizia: paginaPulizia, caldaia: paginaCaldaia, impostazioni: paginaImpostazioni }[pagina] || paginaOggi;
  main.innerHTML = f(v);
}

/* ---------- avvisi comuni ---------- */
function bannerDati() {
  let h = '';
  if (S && !S.caldaiaAccesa) h += `<div class="banner info"><span>☀️</span><div class="testo"><b>Caldaia spenta per la stagione</b>Turni e promemoria sono fermi.</div></div>`;
  const vecchio = Date.now() - statoOra > 15 * 60000;
  if (senzaRete && vecchio) h += `<div class="banner avviso"><span>📶</span><div class="testo"><b>Senza campo</b>Dati aggiornati ${esc(quandoFa(statoOra))}. I carichi vengono salvati e partono da soli.</div></div>`;
  return h;
}

/* ---------- OGGI ---------- */
function paginaOggi(v) {
  const oggi = oggiK();
  const corrente = turnoDel(v.turni, oggi);
  const primo = (v.turni || [])[0];
  let h = bannerDati();
  h += semaforoOggi(v);                                    // 1.6: solo se giallo
  h += riquadroSbancOggi(v);                               // 1.7: solo se chiede un'azione

  // Turno della settimana (ed eventuale giorno coperto da un altro)
  if (corrente) {
    const cop = copertura(v, oggi, corrente);
    const nota = notaSenzaCoperture(corrente.nota);
    const tocca = cop ? isMio(cop.da) : isMio(corrente.appartamento);
    h += `<section class="turno-ora" style="--c:${esc(colore(corrente.appartamento))}">
      <div class="etichetta">Di turno questa settimana</div>
      <div class="nome">${esc(corrente.appartamento)}</div>
      <div class="date">${esc(fmtG(corrente.dal))} – ${esc(fmtG(corrente.al))}</div>
      ${nota ? `<div class="date">${esc(nota)}</div>` : ''}
      ${cop ? `<div class="oggi-carica">Oggi carica <b>${esc(cop.da)}</b>, al posto di ${esc(corrente.appartamento)}</div>` : ''}
      ${tocca ? `<span class="tuo">${cop ? 'Oggi tocca a te' : 'Tocca a te'}</span>` : ''}</section>`;
    if (v.pulizia && v.pulizia.semaforo === 'verde' && v.caldaiaAccesa) h += '<div class="verde-piccolo"><i></i>caldaia in funzione</div>';
  } else if (primo && primo.dal > oggi) {
    // prima dell'inizio: carica già chi ha il primo turno
    h += `<section class="turno-ora" style="--c:${esc(colore(primo.appartamento))}">
      <div class="etichetta">Di turno adesso</div>
      <div class="nome">${esc(primo.appartamento)}</div>
      <div class="date">fino a ${esc(fmtG(primo.al))} · i turni partono ${esc(GGL[dk(primo.dal).getUTCDay()])} ${esc(fmtG(primo.dal, false))}</div>
      ${isMio(primo.appartamento) ? '<span class="tuo">Tocca a te</span>' : ''}</section>`;
  }

  // Richieste di sostituzione degli altri
  for (const s of v.scambi || []) {
    if (isMio(s.appartamento)) continue;
    const di = s.richiestoDa !== s.appartamento ? ' (turno di ' + esc(s.appartamento) + ')' : '';
    h += `<div class="banner avviso"><span>🔁</span><div class="testo">
      ${s.giorno
        ? `<b>${esc(s.richiestoDa)} cerca chi carica ${esc(GGL[dk(s.giorno).getUTCDay()])} ${esc(fmtG(s.giorno, false))}</b>Solo quel giorno${di}.`
        : `<b>${esc(s.richiestoDa)} cerca un sostituto</b>Settimana ${esc(fmtSett(s.dal, s.al))}${di}.`}
      <div class="btns"><button class="btn piccolo primario" data-az="scambioAccetta" data-id="${esc(s.id)}">Lo faccio io</button></div></div></div>`;
  }
  // Giorni in cui ho promesso di caricare io (da domani in poi)
  const promessi = (v.coperture || []).filter(c => isMio(c.da) && c.giorno > oggi);
  if (promessi.length) {
    h += `<section class="scheda riga"><span style="font-size:1.6rem">🤝</span><div style="flex:1">
      <div class="tenue piccolo">Hai detto che carichi tu</div>
      ${promessi.map(c => `<div><b>${esc(GGL[dk(c.giorno).getUTCDay()])} ${esc(fmtG(c.giorno, false))}</b> al posto di ${esc(c.appartamento)}</div>`).join('')}</div></section>`;
  }

  // Carico
  const carichi = v.carichiOggi || [];
  const totale = carichi.reduce((a, c) => a + Number(c.sacchi || 0), 0);
  h += `<section class="scheda">
    <h2>Quanti sacchi hai caricato?</h2>
    <div class="scelta" role="group" aria-label="Numero di sacchi">
      ${[1, 2, 3, 4, 5, 6].map(n => `<button data-az="sacchi" data-n="${n}" aria-pressed="${n === ui.sacchi}">${n}</button>`).join('')}
    </div>
    <button class="btn primario grande" data-az="carica">Ho caricato ${esc(sacchiTesto(ui.sacchi))}</button>
    <p class="tenue piccolo" style="text-align:center;margin:8px 0 0">Il sacco si conta quando lo apri, anche se non entra tutto.</p>
    <button class="link-btn" data-az="dimenticato">Ho dimenticato di registrare un carico</button>
    <button class="link-btn" data-az="prelievo">Ho preso sacchi</button>
    <h3>Oggi ${totale ? `<span class="tenue">· ${esc(sacchiTesto(totale))}</span>` : ''}</h3>
    ${carichi.length ? `<ul class="lista">${carichi.map(rigaCarico).join('')}</ul>`
      : '<p class="tenue">Nessun carico registrato oggi.</p>'}
  </section>`;
  h += avvisoIeri(v);
  h += puliziaVicinaOggi(v);                               // 1.6

  // Sacchi nel locale
  h += schedaSerbatoio(v, true);

  // Il mio prossimo turno
  const mio = prossimoMio(v);
  const giaInAlto = (corrente && isMio(corrente.appartamento)) || (!corrente && primo && mio && mio.dal === primo.dal);
  if (mio && !giaInAlto) {
    h += `<section class="scheda riga"><span style="font-size:1.6rem">📅</span><div class="cresce" style="flex:1">
      <div class="tenue piccolo">Il tuo prossimo turno</div><b>${esc(fmtSett(mio.dal, mio.al))}</b>, ${esc(traQuanto(diffG(oggi, mio.dal)))}
      ${mio.stato === 'previsto' ? ' <span class="etic">previsto</span>' : ''}</div>
      <button class="btn piccolo" data-az="vai" data-p="turni">Turni</button></section>`;
  }

  h += bannerNotifiche() + bannerInstalla();
  return h;
}

function rigaCarico(c) {
  return `<li><span class="ora">${esc(c.ora)}</span>
    <span class="cresce">${esc(c.persona)}${c.attesa ? '<br><span class="etic attesa">da inviare</span>' : ''}</span><b>${esc(sacchiTesto(c.sacchi))}</b>
    ${c.attesa ? `<button class="btn mini pericolo" data-az="annullaCoda" data-id="${esc(c.opId)}">Annulla</button>` : ''}
    ${c.annullabile ? `<button class="btn mini pericolo" data-az="annullaCarico" data-id="${esc(c.id)}" data-n="${esc(c.sacchi)}" data-ora="${esc(c.ora)}">Annulla</button>` : ''}</li>`;
}

/* "Ieri non risulta nessun carico": compare solo quando lo storico è già più
 * vecchio di ieri, a stagione accesa, e finché qualcuno non risponde. */
function avvisoIeri(v) {
  if (!v.caldaiaAccesa || v.oggi !== oggiK()) return '';
  const ieri = addG(oggiK(), -1);
  if (ls.get(K.ieriVisto) === ieri) return '';
  const mov = v.ultimiMovimenti || [];
  if (!mov.some(m => m.giorno < ieri)) return '';
  const caricato = mov.some(m => m.tipo === 'CARICO' && m.giorno === ieri) ||
    coda().some(o => o.azione === 'carico' && chiaveLocale(new Date(o.quando)) === ieri);
  if (caricato) return '';
  return `<div class="banner avviso"><span>❓</span><div class="testo"><b>Ieri non risulta nessun carico</b>
    ${esc(GGL[dk(ieri).getUTCDay()])} ${esc(fmtG(ieri, false))}. Se qualcuno ha caricato, registralo adesso.
    <div class="btns"><button class="btn piccolo" data-az="ieriVisto">Nessuno ha caricato</button>
    <button class="btn piccolo primario" data-az="dimenticato" data-g="1">Registra il carico</button></div></div></div>`;
}

function schedaSerbatoio(v, conLink) {
  const s = v.sacchi;
  const perc = Math.max(0, Math.min(100, s.locale / CAPIENZA_LOCALE * 100));
  const giorni = s.giorniRestanti;
  const cls = giorni != null && giorni <= 3 ? 'critico' : giorni != null && giorni <= 6 ? 'basso' : '';
  return `<section class="scheda">
    <div class="riga spazio"><h2 style="margin:0">Sacchi nel locale</h2>
    ${conLink ? '<button class="btn piccolo" data-az="vai" data-p="pellet">Dettagli</button>' : ''}</div>
    <div class="serbatoio ${cls}" role="img" aria-label="${esc(s.locale)} sacchi su ${CAPIENZA_LOCALE}"><div style="width:${perc}%"></div></div>
    <p style="font-size:1.1rem">Restano <b>${esc(sacchiTesto(s.locale))}</b>${giorni != null ? `, circa <b>${esc(Math.max(0, Math.floor(giorni)))} giorni</b>` : ''}.</p>
    ${cls === 'critico' ? `<p style="color:var(--errore);font-weight:650">Bisogna organizzarsi per sbancalare un pallet.</p>` : ''}
  </section>`;
}

function bannerNotifiche() {
  const st = statoNotifiche();
  if (st === 'attive' || st === 'no') return '';
  if (st === 'denied') return `<div class="banner errore"><span>🔕</span><div class="testo"><b>Notifiche bloccate</b>
    Così non ricevi i promemoria. <a href="#" data-az="vai" data-p="impostazioni">Come sbloccarle</a></div></div>`;
  return `<div class="banner info"><span>🔔</span><div class="testo"><b>Attiva le notifiche</b>Per ricevere i promemoria del turno e del carico.
    <div class="btns"><button class="btn primario" data-az="notifiche">Attiva le notifiche</button></div></div></div>`;
}
function bannerInstalla() {
  if (standalone()) return '';
  return `<div class="banner info"><span>📲</span><div class="testo"><b>Metti l'app sulla schermata Home</b>
    ${installPrompt ? 'Un tocco e avrai l\'icona come le altre app.' : 'Tocca il menu ⋮ in alto a destra di Chrome, poi «Installa app» oppure «Aggiungi a schermata Home».'}
    ${installPrompt ? '<div class="btns"><button class="btn primario" data-az="installa">Installa</button></div>' : ''}</div></div>`;
}

/* ---------- TURNI ---------- */
function paginaTurni(v) {
  const oggi = oggiK();
  const corrente = turnoDel(v.turni, oggi);
  const mio = prossimoMio(v);
  let h = bannerDati();

  // in alto: il mio turno
  if (mio) {
    const ora = mio.dal <= oggi;
    h += `<section class="scheda" style="border-left:8px solid ${esc(colore(mio.appartamento))}">
      <div class="tenue piccolo">${ora ? 'Sei di turno adesso' : 'Il tuo prossimo turno'}</div>
      <div style="font-size:1.35rem;font-weight:800">${esc(fmtSett(mio.dal, mio.al))}</div>
      <div class="tenue">${ora ? 'fino a ' + esc(GGL[dk(mio.al).getUTCDay()]) + ' ' + esc(fmtG(mio.al, false)) : esc(traQuanto(diffG(oggi, mio.dal)))}
      ${mio.stato === 'previsto' ? ' · previsto, può ancora cambiare' : ''}</div></section>`;
  }

  // richieste aperte
  const scambi = v.scambi || [];
  if (scambi.length) {
    h += `<section class="scheda"><h2>Richieste di sostituzione</h2><ul class="lista">${scambi.map(s => `<li><div class="cresce">
      <b>${s.giorno ? esc(GGL[dk(s.giorno).getUTCDay()]) + ' ' + esc(fmtG(s.giorno, false)) : esc(fmtSett(s.dal, s.al))}</b> · <span class="pill" style="--c:${esc(colore(s.appartamento))}">${esc(s.appartamento)}</span>
      <div class="tenue piccolo">${s.giorno ? 'solo questo giorno · ' : 'tutta la settimana · '}chiesta da ${esc(s.richiestoDa)}</div></div>
      ${isMio(s.appartamento)
        ? `<button class="btn piccolo pericolo" data-az="scambioAnnulla" data-id="${esc(s.id)}">Annulla</button>`
        : `<button class="btn piccolo primario" data-az="scambioAccetta" data-id="${esc(s.id)}">Lo faccio io</button>`}</li>`).join('')}</ul></section>`;
  }

  // calendario
  h += `<section class="scheda">
    <div class="selettore" role="group">
      <button data-az="vista" data-v="elenco" aria-pressed="${ui.vista === 'elenco'}">Elenco</button>
      <button data-az="vista" data-v="mese" aria-pressed="${ui.vista === 'mese'}">Mese</button>
    </div>
    <label class="spunta"><input type="checkbox" data-az="soloMiei" ${ui.soloMiei ? 'checked' : ''}> Solo i miei turni</label>
    ${ui.vista === 'mese' ? vistaMese(v) : vistaElenco(v, corrente)}
  </section>`;

  h += sezioneIndisponibilita(v);
  return h;
}

function vistaElenco(v, corrente) {
  const oggi = oggiK();
  const aperti = new Set((v.scambi || []).filter(s => !s.giorno).map(s => s.dal));
  const giorniAperti = dal => (v.scambi || []).filter(s => s.giorno && s.dal === dal).map(s => s.giorno).sort();
  const coperti = t => (v.coperture || []).filter(c => c.appartamento === t.appartamento && c.giorno >= t.dal && c.giorno <= t.al).sort((a, b) => a.giorno.localeCompare(b.giorno));
  let turni = (v.turni || []).filter(t => ui.passate || t.al >= oggi);
  if (ui.soloMiei) turni = turni.filter(t => isMio(t.appartamento) || coperti(t).some(c => isMio(c.da)));
  const passate = (v.turni || []).some(t => t.al < oggi);
  let h = turni.length ? '' : '<p class="tenue">Nessuna settimana da mostrare.</p>';
  h += '<div>' + turni.map(t => {
    const cls = ['settimana', t.stato === 'previsto' ? 'previsto' : '', corrente && t.dal === corrente.dal ? 'corrente' : '', t.al < oggi ? 'passata' : ''].join(' ');
    const puoChiedere = isMio(t.appartamento) && t.stato === 'confermato' && t.al >= oggi && !aperti.has(t.dal);
    return `<div class="${cls}" style="--c:${esc(colore(t.appartamento))}">
      <div class="barra"></div><div class="corpo">
        <div class="riga spazio"><span class="quando">${esc(fmtG(t.dal))} – ${esc(fmtG(t.al))}</span>
        ${t.stato === 'previsto' ? '<span class="etic">previsto</span>' : '<span class="etic">🔒 confermato</span>'}</div>
        <div class="chi"><span class="pill">${esc(t.appartamento)}</span>${isMio(t.appartamento) ? ' <b>· tu</b>' : ''}</div>
        ${notaSenzaCoperture(t.nota) ? `<div class="tenue piccolo">${esc(notaSenzaCoperture(t.nota))}</div>` : ''}
        ${coperti(t).map(c => `<div class="piccolo">🤝 ${esc(fmtG(c.giorno))}: carica <span class="pill" style="--c:${esc(colore(c.da))}">${esc(c.da)}</span>${isMio(c.da) ? ' <b>· tu</b>' : ''}</div>`).join('')}
        ${aperti.has(t.dal) ? '<div class="piccolo" style="color:var(--avviso);font-weight:650">Sostituzione richiesta per tutta la settimana</div>' : ''}
        ${giorniAperti(t.dal).length ? `<div class="piccolo" style="color:var(--avviso);font-weight:650">Aiuto chiesto per: ${giorniAperti(t.dal).map(g => esc(fmtG(g))).join(', ')}</div>` : ''}
        ${puoChiedere ? `<div class="azioni"><button class="btn piccolo" data-az="scambioChiedi" data-dal="${esc(t.dal)}">Chiedi sostituzione</button></div>` : ''}
      </div></div>`;
  }).join('') + '</div>';
  if (passate) h += `<button class="btn piccolo" style="margin-top:10px" data-az="passate">${ui.passate ? 'Nascondi le settimane passate' : 'Mostra le settimane passate'}</button>`;
  h += `<p class="tenue piccolo" style="margin-top:12px">🔒 Le settimane confermate cambiano solo con una sostituzione. Quelle previste possono spostarsi se qualcuno segna un'assenza: in quel caso arriva una notifica.</p>`;
  return h;
}

function vistaMese(v) {
  const oggi = oggiK();
  if (!ui.mese) ui.mese = oggi.slice(0, 7);
  const [y, m] = ui.mese.split('-').map(Number);
  const primo = `${y}-${p2(m)}-01`;
  const inizio = addG(primo, -((dk(primo).getUTCDay() + 6) % 7)); // lunedì: ogni riga è un turno
  let celle = '';
  for (let i = 0; i < 42; i++) {
    const k = addG(inizio, i);
    if (i % 7 === 0 && i > 0 && k.slice(0, 7) !== ui.mese) break;
    const t = turnoDel(v.turni, k);
    const cop = copertura(v, k, t);
    const chi = cop ? cop.da : t && t.appartamento;   // chi carica quel giorno
    const mostra = t && (!ui.soloMiei || isMio(chi));
    const c = mostra ? colore(chi) : '';
    const alfa = t && t.stato === 'previsto' ? '30' : '66';
    const stile = mostra ? `background:${c}${alfa};border-bottom:4px solid ${c}` : '';
    const nome = mostra && (cop || dk(k).getUTCDay() === 1) ? `<small>${cop ? '🤝 ' : ''}${esc(chi)}</small>` : '';
    celle += `<div class="g ${k.slice(0, 7) !== ui.mese ? 'fuori' : ''} ${k === oggi ? 'oggi' : ''}" style="${stile}">${dk(k).getUTCDate()}${nome}</div>`;
  }
  return `<div class="mese-testa">
      <button class="btn piccolo" data-az="mese" data-d="-1" aria-label="Mese precedente">‹</button>
      <b>${MML[m - 1]} ${y}</b>
      <button class="btn piccolo" data-az="mese" data-d="1" aria-label="Mese successivo">›</button></div>
    <div class="calendario">${['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map(g => `<div class="gs">${g}</div>`).join('')}${celle}</div>
    <div class="legenda">${(v.appartamenti || []).map(a => `<span class="pill" style="--c:${esc(a.colore)}">${esc(a.nome)}</span>`).join('')}</div>
    <p class="tenue piccolo">Ogni riga è una settimana di turno, da lunedì a domenica. Colori pieni: confermate. Colori tenui: previste. 🤝 = giorno coperto da un altro appartamento.</p>`;
}

function sezioneIndisponibilita(v) {
  const oggi = oggiK();
  const lista = (v.indisponibilita || []).slice().sort((a, b) => a.dal.localeCompare(b.dal));
  const a = ui.anteprima;
  return `<section class="scheda" id="assenze">
    <h2>Quando non ci siete</h2>

    <button class="btn" data-az="conta">Ho contato i sacchi</button>

  // Sacchi portati via: le destinazioni fisse una per una, tutte le altre in "Altri"

    h += `<section class="scheda">
    <h2>Sacchi portati via</h2>
    <p class="tenue">Sacchi presi dal locale che non vanno in caldaia: tolgono dai sacchi nel locale, ma non contano nel consumo. Totali da inizio stagione.</p>
    <div class="griglia3">${fisse.map(f => `<div class="cella">${cella(f, (tot.find(t => chiaveTag(t.per) === chiaveTag(f)) || {}).sacchi || 0)}</div>`).join('')}
      <button class="cella cella-btn" data-az="altri" aria-expanded="${ui.altriAperti}">${cella('Altri ' + (ui.altriAperti ? '▴' : '▾'), totAltri)}</button></div>
    ${ui.altriAperti ? (altri.length
      ? `<ul class="lista">${altri.map(t => `<li><span class="cresce">${esc(t.per)}</span><b>${esc(sacchiTesto(t.sacchi))}</b></li>`).join('')}</ul>`
      : '<p class="tenue piccolo">Nessun sacco portato via per altre destinazioni.</p>') : ''}
    <div class="btns"><button class="btn primario" data-az="prelievo">Ho preso sacchi</button></div>
  </section>`;
  }

  const mov = v.ultimiMovimenti || [];
  const inCoda = coda().filter(o => o.codice === codice());
  h += `<section class="scheda"><h2>Ultimi movimenti</h2>`;
  if (!mov.length && !inCoda.length) h += '<p class="tenue">Ancora nessun movimento.</p>';
  else {

    h += '<ul class="lista">';

      if (m.giorno !== giorno) { giorno = m.giorno; h += `<li style="border-top:0;padding-bottom:0"><b class="tenue piccolo" style="text-transform:uppercase;letter-spacing:.04em">${esc(m.giorno === oggiK() ? 'oggi' : fmtG(m.giorno))}</b></li>`; }

    }
    h += '</ul>';
  }
  h += '</section>';
  return h;
}

const DESCR_PULIZIA = {

  cassettoSvuotato: 'cassetto cenere svuotato', puliziaManuale: 'pulizia del libretto'
};
const CASSETTO_VOCI = ['un quarto', 'metà', 'tre quarti', 'pieno', 'traboccava'];
const NOMI_TIPO = { PRESA: 'Me ne occupo io', LASCIATA: 'Non posso più', SPENTA: 'Spenta per pulizia', PULITA: 'Pulita', RIACCESA: 'Riaccesa',
  CASSETTO: 'Cassetto svuotato', FATTA: 'Pulizia inserita a mano', MANUALE: 'Dal libretto' };
const erroriCoda = {};
const giornoRel = k => k === oggiK() ? 'oggi' : k === addG(oggiK(), -1) ? 'ieri' : fmtG(k);
const notteTesto = k => GGL[dk(k).getUTCDay()] + ' ' + dk(k).getUTCDate();

/* Stato "come sarà" con le azioni della pulizia ancora in coda */
function applicaPuliziaInCoda(pu, o) {
  const d = new Date(o.quando), q = { persona: o.chi, giorno: chiaveLocale(d), ora: oraLocale(d) };
  pu.inAttesa = true;
  if (o.azione === 'puliziaSpenta') {
    pu.semaforo = 'giallo'; pu.fase = 'spenta';
    pu.spenta = Object.assign(q, { pulisce: pu.presa ? pu.presa.persona : o.chi });
  } else if (o.azione === 'puliziaPulita') {
    pu.bruciati = 0; pu.cassetto.sacchi = 0;
    pu.ultima = Object.assign({ tipo: 'PULITA' }, q);
    if (o.extra && o.extra.riaccesa) { pu.semaforo = 'verde'; pu.fase = 'normale'; pu.presa = null; }
    else if (pu.semaforo === 'giallo') { pu.fase = 'pulita'; pu.pulita = q; }
    else { pu.fase = 'normale'; pu.presa = null; }
  } else if (o.azione === 'puliziaRiaccesa') {
    pu.semaforo = 'verde'; pu.fase = 'normale'; pu.presa = null;
  } else if (o.azione === 'cassettoSvuotato') {
    pu.cassetto.sacchi = 0;
  } else if (o.azione === 'puliziaManuale') {
    const m = (pu.manuale || []).find(x => x.voce === (o.extra || {}).voce);
    if (m) m.ultima = q.giorno;
  }
}

async function azioneLocale(azione, extra, msgOk) {
  const op = { id: uuid(), azione, quando: new Date().toISOString(), codice: codice(), chi: S.io.nome, extra: extra || {} };
  toast('Salvato, lo sto inviando…');
  await accoda(op);
  if (erroriCoda[op.id]) { delete erroriCoda[op.id]; return; }      // l'errore è già stato mostrato
  if (coda().some(o => o.id === op.id)) toast('Niente campo: salvato sul telefono, partirà da solo appena possibile.', 'avviso', 6500);
  else toast(msgOk || 'Registrato ✓', 'ok');
}

function semaforoBox(pu) {
  if (!pu || pu.errore || pu.semaforo !== 'giallo') return '';
  const sp = pu.spenta || {}, pl = pu.pulita;
  const riga = pu.fase === 'pulita' && pl
    ? `Pulita da ${esc(pl.persona)} ${esc(giornoRel(pl.giorno))} alle ${esc(pl.ora)}: manca solo la riaccensione.`
    : `${esc(sp.persona || '')}${sp.giorno ? ', ' + esc(giornoRel(sp.giorno)) + ' alle ' + esc(sp.ora) : ''}${sp.pulisce ? ' · la pulisce ' + esc(sp.pulisce) : ''}`;
  return `<div class="semaforo"><span class="luce" aria-hidden="true"></span><div style="flex:1"><b>Caldaia spenta per pulizia</b>${riga}
    ${pu.inAttesa ? ' <span class="etic attesa">da inviare</span>' : ''}</div></div>`;
}
function semaforoOggi(v) {
  const box = semaforoBox(v.pulizia);

  const mancano = pu.notte && pu.notte.giorno ? diffG(oggiK(), pu.notte.giorno) : 99;
  let testo = '';
  if (pu.fase === 'vicina') testo = `<b>Pulizia vicina</b>Notte consigliata: ${esc(notteTesto(pu.notte.giorno))}${pu.notte.tmin != null ? ' (' + esc(temp(pu.notte.tmin)) + ')' : ''}. Chi se ne occupa?`;
  else if (pu.fase === 'presa' && pu.presa && diffG(oggiK(), pu.presa.notte) <= 3) testo = `<b>Pulizia: se ne occupa ${esc(pu.presa.persona)}</b>Spegnimento ${esc(notteTesto(pu.presa.notte))} sera, pulizia ${esc(notteTesto(addG(pu.presa.notte, 1)))} mattina.`;
  if (!testo || (pu.fase === 'vicina' && mancano > 3 && !pu.avvisoPartito)) return '';
  return `<div class="banner info"><span>🧹</span><div class="testo">${testo}
    <div class="btns"><button class="btn piccolo primario" data-az="vai" data-p="pulizia">Apri</button></div></div></div>`;
}

function passoPulizia(pu) {
  const io = S.io, oggi = oggiK();
  const fonte = pu.fonte === 'senza previsioni' ? '<div class="fonte">Senza previsioni meteo: la notte è stimata dai sacchi.</div>'
    : `<div class="fonte">${pu.fonte === 'previsioni di ieri' ? 'Previsioni di ieri · ' : ''}Previsioni: Open-Meteo.com</div>`;
  const notte = pu.notte && pu.notte.giorno;
  switch (pu.fase) {
    case 'vicina':
      return `<div class="passo"><b>Pulizia vicina</b>
        <p>Notte consigliata: <b>${esc(notteTesto(notte))}</b>${pu.notte.tmin != null ? ' – previsti ' + esc(temp(pu.notte.tmin)) + ', la più mite dei prossimi giorni secondo le previsioni meteo' : ''}.</p>
        <p class="tenue piccolo">Chi se ne occupa tocca il pulsante entro le ${esc(pu.limitePresa)} della sera scelta. La sera, chi carica riceve il promemoria per spegnere.</p>
        <button class="btn primario grande" data-az="puliziaPresa">Me ne occupo io</button>${fonte}</div>`;
    case 'presa': {
      const p = pu.presa, mia = p.persona === io.nome, sera = oggi >= p.notte, dopo = oggi > p.notte;
      return `<div class="passo"><b>Se ne occupa ${esc(p.persona)}${mia ? ' (tu)' : ''}</b>
        <p>Spegnimento <b>${esc(notteTesto(p.notte))} sera</b> entro le 21, pulizia <b>${esc(notteTesto(addG(p.notte, 1)))} mattina</b> a caldaia fredda.</p>
        ${sera ? '<button class="btn primario grande" data-az="spenta">Spenta per pulizia</button>' : '<p class="tenue piccolo">Quella sera chi carica riceve il promemoria per spegnere.</p>'}
        ${dopo ? '<button class="btn" data-az="pulita">Pulita</button>' : ''}
        ${mia || io.admin ? '<button class="btn pericolo" data-az="puliziaLasciata">Non posso più</button>' : ''}</div>`;
    }
    case 'spenta':
      return semaforoBox(pu) + `<button class="btn primario grande" data-az="pulita">Pulita</button>
        <button class="btn" style="margin-top:10px" data-az="riaccesa">Riaccesa (senza pulizia)</button>`;
    case 'pulita':
      return semaforoBox(pu) + '<button class="btn primario grande" data-az="riaccesa">Riaccesa</button>';
    default:
      return `<div class="passo"><p>${notte ? 'Prossima pulizia verso la notte di <b>' + esc(notteTesto(notte)) + '</b>' + (pu.notte.tmin == null ? ' (stima dai sacchi)' : '') + '.' : ''}
        L'avviso arriva a tutti 3 giorni prima.</p>
        ${(pu.alternative || []).length || pu.notte.tmin != null ? '<button class="btn" data-az="puliziaPresa">Me ne occupo io</button>' : ''}</div>`;
  }
}

function paginaPulizia(v) {
  const pu = v.pulizia;
  let h = bannerDati();
  if (!pu) return h + '<section class="scheda"><h2>Pulizia</h2><p class="tenue">Questa pagina ha bisogno dello script 1.6. Avvisa Francesco.</p></section>';
  if (pu.errore) return h + `<div class="banner errore"><div class="testo"><b>Non riesco a leggere la pulizia</b>${esc(pu.errore)}. Avvisa Francesco.</div></div>`;
  const perc = Math.max(0, Math.min(100, pu.bruciati / pu.soglia * 100));
  const cls = pu.bruciati >= pu.finestra.sacchiA ? 'critico' : pu.bruciati >= pu.finestra.sacchiDa ? 'basso' : '';
  const ult = pu.ultima || {};
  const ultima = ult.tipo === 'ACCENSIONE' ? `dall'accensione (${esc(fmtG(ult.giorno))})`
    : `dall'ultima pulizia: ${esc(fmtG(ult.giorno))}${ult.persona ? ', ' + esc(ult.persona) : ''}`;
  h += `<section class="scheda"><h2>Pulizia completa</h2>
    <div class="serbatoio ${cls}" role="img" aria-label="${esc(pu.bruciati)} sacchi su ${esc(pu.soglia)}"><div style="width:${perc}%"></div></div>
    <p style="font-size:1.1rem"><b>${esc(pu.bruciati)} su ${esc(pu.soglia)} sacchi</b> ${ultima}</p>
    <p class="tenue piccolo">Si pulisce tra ${esc(pu.finestra.sacchiDa)} e ${esc(pu.finestra.sacchiA)} sacchi, a caldaia spenta e fredda: sassi e cenere dal braciere, scovolo della camera, aspirazione. Si svuota sempre anche il cassetto cenere.</p>
    ${passoPulizia(pu)}
    ${pu.semaforo === 'verde' ? '<button class="link-btn" data-az="puliziaFatta">Ho fatto la pulizia senza l\'app</button>' : ''}
  </section>`;

  const c = pu.cassetto || {};
  h += `<section class="scheda"><h2>Cassetto cenere</h2>
    <p style="font-size:1.1rem"><b>${esc(sacchiTesto(c.sacchi || 0))}</b> dall'ultimo svuotamento</p>
    <p class="tenue">${c.capienza ? `Capienza stimata: circa <b>${esc(c.capienza)} sacchi</b>. Quando ci si avvicina, chi è di turno riceve un avviso.`
      : `In apprendimento (${esc(c.stime)} ${c.stime === 1 ? 'svuotamento' : 'svuotamenti'} su ${esc(c.minime)}): dopo ${esc(c.minime)} svuotamenti l'app stima da sola quanto tiene.`}</p>
    <button class="btn" data-az="cassetto">Ho svuotato il cassetto</button>
    <p class="tenue piccolo">Si può svuotare anche a caldaia accesa, quando capita.</p></section>`;

  h += `<section class="scheda"><h2>Dal libretto</h2>
    <p class="tenue piccolo">Pulizie del libretto ALP45 (pag. 24–28), solo come indicazione: nessun avviso. Sempre guanti e mascherina; per camera fumi e ventola caldaia fredda e interruttore su 0.</p>
    <div>${PULIZIE.map(([voce, quando, testo]) => {
      const u = ((pu.manuale || []).find(m => m.voce === voce) || {}).ultima;
      return `<div class="voce-man"><div class="cresce"><b>${esc(quando)}</b><div class="piccolo">${esc(testo)}</div>
        <div class="tenue piccolo">${u ? 'Ultima volta: ' + esc(fmtG(u)) : 'Mai segnata'}</div></div>
        <button class="btn mini" data-az="manuale" data-voce="${esc(voce)}">Fatto oggi</button></div>`;
    }).join('')}</div>
    <p class="tenue piccolo">In casa si fa la pulizia completa ogni circa 15 giorni, che comprende in parte le voci settimanali.</p></section>`;

  const st = pu.storico || [];
  const nomeVoce = voce => ((PULIZIE.find(x => x[0] === voce) || [])[1] || '').toLowerCase();
  h += `<section class="scheda"><h2>Storico</h2>${st.length ? `<ul class="lista">${st.map(r => {
    const det = r.tipo === 'PULITA' || r.tipo === 'FATTA'
      ? [r.sporco && r.sporco + ' sporco', r.sassi && 'sassi ' + r.sassi, r.cassetto && 'cassetto ' + r.cassetto].filter(Boolean).join(', ')
      : r.tipo === 'CASSETTO' ? 'era ' + r.cassetto : r.tipo === 'MANUALE' ? nomeVoce(r.voce) : r.tipo === 'PRESA' && r.notte ? 'notte di ' + notteTesto(r.notte) : '';
    return `<li><span class="ora">${esc(fmtG(r.giorno, false))}<br>${esc(r.ora)}</span><span class="cresce"><b>${esc(NOMI_TIPO[r.tipo] || r.tipo)}</b> · ${esc(r.persona)}
      ${det ? `<div class="tenue piccolo">${esc(det)}</div>` : ''}</span></li>`;
  }).join('')}</ul>` : '<p class="tenue">Ancora niente.</p>'}</section>`;
  return h;
}

/* =====================================================================
 *  SBANCALAMENTO (1.7)
 *  Le risposte, "Ci sono anch'io" e "Fissa il giorno" richiedono la rete, come
 *  turni e assenze. La conta e "Pallet sbancalato" funzionano anche senza campo.
 * ===================================================================== */
const RISP_NOMI = { MATTINA: 'mattina', POMERIGGIO: 'pomeriggio', ENTRAMBE: 'tutti e due', NO: 'non ci sono' };
const ORE_CONTA = 3;
const giornoMeseL = k => { const d = dk(k); return GGL[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MML[d.getUTCMonth()]; };
const fasciaBreve = t => String(t || '').replace(/0?(\d{1,2}):00/g, '$1');
const mieRisposte = g => (g.risposte.find(r => r.persona === S.io.nome) || {}).giorni || {};
const rispostoTutto = g => { const m = mieRisposte(g); return g.giorni.filter(d => d.giorno > oggiK()).every(d => m[d.giorno]); };
const chiCe = (g, giorno, fascia) => g.risposte.filter(r => r.giorni[giorno] === fascia || r.giorni[giorno] === 'ENTRAMBE').map(r => r.persona);
/* Una conta delle ultime 3 ore (anche ancora sul telefono) vale per "Pallet sbancalato" */
function contaRecente(v) {
  const q = coda().filter(o => o.azione === 'conta' && o.codice === codice() && Date.now() - new Date(o.quando) < ORE_CONTA * 3600000).pop();
  if (q) return { sacchi: q.sacchi, ora: oraLocale(new Date(q.quando)), attesa: true };
  const sbn = v.sbancalamento;
  return sbn && !sbn.errore ? sbn.contaRecente : null;
}
function elencoGiorniSb(lista) {
  const p = lista.map(k => GG[dk(k).getUTCDay()] + ' ' + dk(k).getUTCDate());
  const ultimo = lista[lista.length - 1];
  return (p.length > 1 ? p.slice(0, -1).join(', ') + ' e ' + p[p.length - 1] : p[0]) + ' ' + MM[dk(ultimo).getUTCMonth()];
}
function testoDeciso(sbn, g) {
  const d = g.deciso;
  const chi = d.persone.length ? d.persone.join(', ') : 'nessuno si è ancora aggiunto';
  return `<b>${esc(giornoMeseL(d.giorno))} ${esc(RISP_NOMI[d.fascia])}</b>${d.fascia === 'POMERIGGIO' && d.tramonto ? ` <span class="tenue piccolo">(luce fino alle ${esc(d.tramonto)})</span>` : ''}
    <div class="chi">Ci sono: ${esc(chi)}${d.coppia ? ` · <b>in ${esc(d.persone.length)}: si possono fare 2 pallet</b>` : ''}</div>
    ${d.fissato ? '<div class="tenue piccolo">Giorno fissato da Francesco.</div>' : ''}`;
}

/* Pagina Oggi: solo quello che chiede un'azione */
function riquadroSbancOggi(v) {
  const sbn = v.sbancalamento;
  if (!sbn || sbn.errore || !sbn.giro || !v.caldaiaAccesa) return '';
  const g = sbn.giro, oggi = oggiK();
  if (g.stato === 'APERTO') {
    if (rispostoTutto(g) || (!g.richiesta && ls.get(K.sbChiuso) === g.id)) return '';
    const futuri = g.giorni.filter(d => d.giorno > oggi).map(d => d.giorno);
    if (!futuri.length) return '';
    return `<section class="scheda sbanc ${g.richiesta ? '' : 'consigliata'}"><div class="testa"><h2>📦 Sbancalamento</h2>
      ${g.richiesta ? '' : `<button class="chiudi" data-az="sbancChiudi" data-id="${esc(g.id)}" aria-label="Chiudi">✕</button>`}</div>
      <p>${g.tipo === 'COPPIA' ? `Si possono portare dentro 2 pallet (servono ${esc(sbn.soglie.minCoppia)} persone; in ${esc(sbn.soglie.minPallet)} se ne porta uno).`
        : g.richiesta ? 'Bisogna portare dentro un pallet.' : 'Si può già portare dentro un pallet.'}</p>
      <p>Giorni proposti: <b>${esc(elencoGiorniSb(futuri))}</b>.${g.scadenza ? ` Rispondi entro ${esc(GGL[dk(g.scadenza).getUTCDay()])} alle ${esc(sbn.soglie.oraRisposta || '18:00')}.` : ''}</p>
      <button class="btn primario" data-az="sbancRispondi">Rispondi</button>
      <p class="fonte">Proposti in base alle previsioni meteo · Open-Meteo.com</p></section>`;
  }
  if (g.stato === 'DECISO' && g.deciso) {
    const d = g.deciso, ci = d.persone.includes(S.io.nome);
    if (d.giorno > oggi) {
      return `<section class="scheda sbanc"><div class="testa"><h2>📦 Sbancalamento deciso</h2></div>
        <p>${testoDeciso(sbn, g)}</p>
        ${ci ? '<p class="tenue piccolo">Ci sei anche tu. Se cambia qualcosa, avvisa gli altri a voce o su WhatsApp.</p>' : '<button class="btn" data-az="sbancAggiungi">Ci sono anch\'io</button>'}</section>`;
    }
    const recente = contaRecente(v);
    return `<section class="scheda sbanc"><div class="testa"><h2>📦 ${d.giorno === oggi ? 'Oggi si sbancala' : 'Avete sbancalato?'}</h2></div>
      <p>${testoDeciso(sbn, g)}</p>
      <ol class="passi-sb">
        <li class="${recente ? 'fatto' : ''}"><b>Prima di iniziare: conta i sacchi interi rimasti</b>
          ${recente ? `<div>Contati <b>${esc(recente.sacchi)}</b> alle ${esc(recente.ora)}${recente.attesa ? ' <span class="etic attesa">da inviare</span>' : ''}.</div>`
            : `<label class="campo"><span>Sacchi interi contati</span><input type="number" class="numero" id="sbContati" inputmode="numeric" min="0" max="500" step="1"></label>
               <button class="btn" data-az="sbancConta">Registra la conta</button>`}</li>
        <li><b>Poi registra i pallet portati dentro</b>
          <button class="btn primario" data-az="sbancala">Pallet sbancalato</button></li>
      </ol>
      ${ci ? '' : '<button class="link-btn" data-az="sbancAggiungi">Ci sono anch\'io</button>'}</section>`;
  }
  return '';
}

/* Pagina Pellet, in alto: finestra, giro con le risposte, quota registrata */
function sezioneSbancPellet(v) {
  const sbn = v.sbancalamento;
  if (!sbn) return '';
  if (sbn.errore) return `<div class="banner errore"><div class="testo"><b>Sbancalamento non disponibile</b>${esc(sbn.errore)}. Avvisa Francesco.</div></div>`;
  const oggi = oggiK(), d = sbn.date || {}, c = sbn.circa || {}, g = sbn.giro;
  const data = (k, circa) => (k <= oggi ? 'da oggi' : (circa ? 'circa dal ' : 'dal ') + fmtG(k, false));
  let finestra;
  if (sbn.pallet <= 0) finestra = 'Fuori non ci sono più pallet.';
  else if (!d.apertura && !d.coppia) finestra = 'Nessuno sbancalamento in vista.';
  else {
    const parti = [];
    if (d.apertura) parti.push('Un pallet ' + data(d.apertura, c.apertura));
    if (d.coppia) parti.push('coppia ' + data(d.coppia, c.coppia));
    if (d.chiusura) parti.push((d.chiusura <= oggi ? 'il locale è quasi vuoto' : 'entro ' + (c.chiusura ? 'circa ' : '') + 'il ' + fmtG(d.chiusura, false)));
    finestra = parti.join(' · ');
  }
  let h = `<section class="scheda"><h2>📦 Sbancalamento</h2><p style="font-size:1.05rem">${esc(finestra)}</p>`;
  if (g && g.stato === 'APERTO') {
    const nonRisp = g.risposte.filter(r => !g.giorni.filter(x => x.giorno > oggi).every(x => r.giorni[x.giorno])).map(r => r.persona);
    h += `<h3>${g.richiesta ? 'Proposta in corso' : 'Proposta (risposta facoltativa)'}${g.fase === 'SECONDO GIRO' ? ' · seconda' : ''}</h3>
      <ul class="giorni-sb">${g.giorni.map(x => {
        const f = (nome, fascia, info) => {
          const chi = chiCe(g, x.giorno, fascia);
          return `<div class="fascia ${info.asciutta ? '' : 'piove'}"><b>${nome}${info.asciutta ? '' : ' · pioggia'}</b>${chi.length ? esc(chi.join(', ')) : '<span class="tenue">nessuno</span>'}</div>`;
        };
        return `<li><b>${esc(GGL[dk(x.giorno).getUTCDay()])} ${esc(fmtG(x.giorno, false))}</b>${x.coppia && g.tipo === 'COPPIA' ? ' <span class="etic">2 pallet</span>' : ''}
          <div class="fasce">${f('Mattina', 'MATTINA', x.mattina)}${f(x.tramonto ? 'Pom. · luce fino ' + x.tramonto : 'Pomeriggio', 'POMERIGGIO', x.pomeriggio)}</div></li>`;
      }).join('')}</ul>
      ${nonRisp.length ? `<p class="tenue piccolo">Non hanno ancora risposto: ${esc(nonRisp.join(', '))}.</p>` : '<p class="tenue piccolo">Hanno risposto tutti.</p>'}
      ${g.scadenza ? `<p class="piccolo">Si decide ${esc(GGL[dk(g.scadenza).getUTCDay()])} ${esc(fmtG(g.scadenza, false))} alle ${esc(sbn.soglie.oraRisposta || '18:00')}, o prima se rispondono tutti.</p>` : ''}
      <button class="btn ${rispostoTutto(g) ? '' : 'primario'}" data-az="sbancRispondi">${rispostoTutto(g) ? 'Cambia la mia risposta' : 'Rispondi'}</button>
      <p class="fonte">Proposti in base alle previsioni meteo · Open-Meteo.com</p>`;
    if (S.io.admin && g.note.length) h += `<h3>Note (le vedi solo tu)</h3><ul class="lista">${g.note.map(n => `<li><span class="cresce"><b>${esc(n.persona)}</b>: ${esc(n.nota)}</span></li>`).join('')}</ul>`;
  } else if (g && g.stato === 'DECISO' && g.deciso) {
    h += `<h3>Deciso</h3><p>${testoDeciso(sbn, g)}</p>
      ${g.deciso.persone.includes(S.io.nome) ? '' : '<button class="btn" data-az="sbancAggiungi">Ci sono anch\'io</button>'}`;
  }
  const q = sbn.quota;
  if (q && q.quota != null) {
    h += `<h3>Sacchi registrati</h3><div class="riga"><span class="quota">${esc(q.quota)}%</span>
      <span class="tenue piccolo">Ultima conta ${esc(fmtG(q.giorno))} alle ${esc(q.ora)}: ${esc(q.contati)} sacchi, ne risultavano ${esc(q.risultavano)}.
      ${q.mancanti < 0 ? esc(sacchiTesto(-q.mancanti)) + ' in più del previsto.' : q.mancanti > 0 ? esc(sacchiTesto(q.mancanti)) + ' non registrati.' : ''}</span></div>`;
  }
  if (S.io.admin) h += '<div class="btns"><button class="btn piccolo" data-az="sbancFissa">Fissa il giorno</button></div>';
  return h + '</section>';
}

const gruppo = (nome, valori, scelto, cls) => `<div class="scelta ${cls || 'giudizio'}" data-gruppo="${nome}">${valori.map(x =>
  `<button data-valore="${esc(x)}" aria-pressed="${x === scelto}">${esc(x)}</button>`).join('')}</div>`;

/* ---------- IMPOSTAZIONI ---------- */

  const io = S.io;
  const st = statoNotifiche();
  const testoNotif = {
    attive: '<span style="color:var(--ok);font-weight:700">✔ Attive su questo telefono</span>',
    'da-registrare': 'Permesso dato, manca la registrazione.',
    default: 'Non ancora attivate.',
    denied: '<span style="color:var(--errore);font-weight:700">Bloccate</span>',
    no: 'Questo browser non le supporta: apri l\'app con Chrome.'
  }[st];
  return `<section class="scheda">
      <div class="tenue piccolo">Questo telefono è collegato a</div>
      <div style="font-size:1.4rem;font-weight:800">${esc(io.nome)}</div>
      <div>Appartamento <span class="pill" style="--c:${esc(colore(io.appartamento))}">${esc(io.appartamento)}</span>${io.admin ? ' · amministratore' : ''}</div>
    </section>
    <section class="scheda">
      <h2>Notifiche</h2>
      <p>${testoNotif}</p>
      ${st === 'denied' ? `<div class="banner avviso"><div class="testo"><b>Come sbloccarle</b>
        ${standalone()
          ? 'Tieni premuta l\'icona «Caldaia» sulla schermata Home → «Info app» → «Notifiche» → attivale.'
          : 'In Chrome tocca il lucchetto accanto all\'indirizzo → «Autorizzazioni» → «Notifiche» → «Consenti».'}
        Poi torna qui e tocca «Riprova».</div></div>` : ''}
      ${st !== 'no' ? `<button class="btn ${st === 'attive' ? '' : 'primario'}" data-az="notifiche">${st === 'attive' ? 'Ricollega le notifiche' : st === 'denied' ? 'Riprova' : 'Attiva le notifiche'}</button>` : ''}
      ${st === 'attive' ? `<div class="prove">
        <h3 style="margin-top:0">Prova le notifiche</h3>
        <button class="btn" data-az="prova" data-tipo="subito">Prova adesso</button>
        <p class="tenue piccolo">Arriva tra pochi secondi: ti dice che le notifiche sono attivate.</p>
        <button class="btn" data-az="prova" data-tipo="chiusa">Prova con l'app chiusa</button>
        <p class="tenue piccolo">Ti arriverà una notifica di prova tra 15 e 30 minuti. Chiudi l'app, toglila anche dalle app recenti e metti via il telefono. Serve per verificare che le impostazioni di risparmio energetico non blocchino le notifiche.</p>
      </div>` : ''}
    </section>
    <section class="scheda">
      <h2>I miei promemoria</h2>
      <label class="spunta"><input type="checkbox" id="prefProm" ${io.promemoria ? 'checked' : ''}> Promemoria del carico, la sera del mio turno</label>
      <label class="campo"><span>A che ora (tra le 7:00 e le 20:45)</span><input type="time" id="prefOra" min="07:00" max="20:45" step="900" value="${esc(io.ora)}"></label>
      <p class="tenue piccolo">Arriva solo se quel giorno nessuno ha ancora caricato.</p>

      <button class="btn primario" data-az="salvaCodice">Collega</button>

}
function estraiCodice(testo) {
  testo = String(testo || '').trim();
  const m = testo.match(/[?&]c=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{6,64}$/.test(testo) ? testo : '';
}
function impostaCodice(c) {
  if (c === codice()) return;
  ls.set(K.codice, c);
  S = null; ls.del(K.stato); ls.del(K.statoOra); statoOra = 0;
  erroreCodice = '';
}
