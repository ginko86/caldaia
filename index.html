  },
  async indispRimuovi(el) {
    if (!(await chiedi({ titolo: 'Togliere questa assenza?', testo: 'Il calendario verrà ricalcolato.', si: 'Togli', pericolo: true }))) return;
    await azioneOnline('indispRimuovi', { id: el.dataset.id }, 'Assenza tolta');
  },
  /* ---------- 1.6: pulizia ---------- */
  async puliziaPresa() {
    const pu = vista().pulizia;
    if (!pu || !pu.notte) return;
    const notti = [pu.notte].concat(pu.alternative || []).sort((a, b) => a.giorno.localeCompare(b.giorno));
    const r = await chiedi({
      titolo: 'Te ne occupi tu?',
      testo: 'Scegli la notte: la sera si spegne la caldaia, la mattina dopo si pulisce a caldaia fredda.',
      html: `<div class="scelta notti" data-gruppo="notte">${notti.map(n => `<button data-valore="${esc(n.giorno)}" aria-pressed="${n.giorno === pu.notte.giorno}">${esc(GG[dk(n.giorno).getUTCDay()])} ${dk(n.giorno).getUTCDate()}<small>${n.tmin != null ? esc(temp(n.tmin)) : 'stima'}${n.giorno === pu.notte.giorno ? ' · consigliata' : ''}</small></button>`).join('')}</div>
        <p class="tenue piccolo">Temperatura = minima prevista il mattino della pulizia. Previsioni: Open-Meteo.com</p>`,
      si: 'Me ne occupo io',
      valida: x => x.notte ? '' : 'Scegli la notte.'
    });
    if (!r) return;
    await azioneOnline('puliziaPresa', { notte: r.notte, id: uuid() }, 'Grazie! Gli altri ricevono un avviso.');
  },
  async puliziaLasciata() {
    if (!(await chiedi({ titolo: 'Non puoi più occuparti della pulizia?', testo: 'Gli altri ricevono un avviso e qualcun altro può prenderla.', si: 'Non posso più', no: 'Indietro', pericolo: true }))) return;
    await azioneOnline('puliziaLasciata', { id: uuid() }, 'Fatto: gli altri ricevono un avviso.');
  },
  async spenta() {
    if (!(await chiedi({ titolo: 'Hai spento la caldaia per la pulizia?', testo: 'Tutti vedono il semaforo giallo e ricevono un avviso.', si: 'Sì, è spenta' }))) return;
    await azioneLocale('puliziaSpenta', {}, 'Caldaia spenta per pulizia ✓');
  },
  async pulita() {
    const r = await chiedi({
      titolo: 'Com\'era la caldaia?',
      html: `<div class="campo"><span>Quanto era sporca?</span>${gruppo('sporco', ['poco', 'normale', 'tanto'])}</div>
        <div class="campo"><span>Quanti sassi nel braciere?</span>${gruppo('sassi', ['pochi', 'normali', 'tanti'])}</div>
        <div class="campo"><span>Quanto era pieno il cassetto cenere? (si svuota sempre)</span>${gruppo('cassetto', CASSETTO_VOCI, null, 'cassetto')}</div>
        <div class="campo"><span>Hai già riacceso la caldaia?</span>
          <div class="scelta due" data-gruppo="riaccesa"><button data-valore="no" aria-pressed="true">Non ancora</button><button data-valore="si" aria-pressed="false">Sì, è accesa</button></div></div>`,
      si: 'Registra',
      valida: x => !x.sporco || !x.sassi || !x.cassetto ? 'Rispondi alle tre domande: servono a capire ogni quanto pulire.' : ''
    });
    if (!r) return;
    await azioneLocale('puliziaPulita', { sporco: r.sporco, sassi: r.sassi, cassetto: r.cassetto, riaccesa: r.riaccesa === 'si' },
      r.riaccesa === 'si' ? 'Pulita e riaccesa ✓ Grazie!' : 'Pulita ✓ Quando la riaccendi, tocca «Riaccesa».');
  },
  async riaccesa() {
    if (!(await chiedi({ titolo: 'La caldaia è ripartita?', testo: 'Dal vetro spia si vede una fiamma viva in tutto il braciere. Tutti ricevono un avviso.', si: 'Sì, riaccesa' }))) return;
    await azioneLocale('puliziaRiaccesa', {}, 'Riaccesa ✓');
  },
  async cassetto() {
    const r = await chiedi({
      titolo: 'Quanto era pieno il cassetto?',
      html: gruppo('cassetto', CASSETTO_VOCI, null, 'cassetto') + '<p class="tenue piccolo">Da questa risposta l\'app impara quanto tiene il cassetto.</p>',
      si: 'Registra', valida: x => x.cassetto ? '' : 'Scegli quanto era pieno.'
    });
    if (!r) return;
    await azioneLocale('cassettoSvuotato', { cassetto: r.cassetto }, 'Cassetto svuotato ✓');
  },
  async manuale(el) {
    const v = PULIZIE.find(x => x[0] === el.dataset.voce);
    if (!v) return;
    if (!(await chiedi({ titolo: 'Fatto oggi?', testo: v[1] + ': ' + v[2], si: 'Sì, fatto' }))) return;
    await azioneLocale('puliziaManuale', { voce: v[0] }, 'Segnato ✓');
  },
  async puliziaFatta() {
    const oggi = oggiK();
    const nr = 'non ricordo';
    const r = await chiedi({
      titolo: 'Pulizia fatta senza l\'app',
      testo: 'Indica quando: il contatore dei sacchi riparte da lì.',
      html: `<div class="campi2"><label class="campo"><span>Giorno</span><input type="date" data-campo="giorno" min="${addG(oggi, -14)}" max="${oggi}" value="${oggi}"></label>
        <label class="campo"><span>Ora, più o meno</span><input type="time" data-campo="ora" value="09:00"></label></div>
        <div class="campo"><span>Quanto era sporca?</span>${gruppo('sporco', ['poco', 'normale', 'tanto', nr], nr, 'giudizio4')}</div>
        <div class="campo"><span>Sassi nel braciere?</span>${gruppo('sassi', ['pochi', 'normali', 'tanti', nr], nr, 'giudizio4')}</div>
        <div class="campo"><span>Cassetto cenere?</span>${gruppo('cassetto', CASSETTO_VOCI.concat([nr]), nr, 'cassetto')}</div>`,
      si: 'Registra',
      valida: x => !/^\d{4}-\d{2}-\d{2}$/.test(x.giorno || '') ? 'Scegli il giorno.' : !/^\d{2}:\d{2}$/.test(x.ora || '') ? 'Scrivi un\'ora, anche approssimativa.' : ''
    });
    if (!r) return;
    const via = x => (x === nr ? '' : x || '');
    await azioneOnline('puliziaFatta', { giorno: r.giorno, ora: r.ora, sporco: via(r.sporco), sassi: via(r.sassi), cassetto: via(r.cassetto), id: uuid() }, 'Pulizia registrata ✓');
  },
  /* ---------- 1.7: sbancalamento ---------- */
  async sbancRispondi() {
    const sbn = vista().sbancalamento;
    const g = sbn && sbn.giro;
    if (!g || g.stato !== 'APERTO') return;
    const mie = mieRisposte(g), futuri = g.giorni.filter(d => d.giorno > oggiK());
    const html = futuri.map(d => {
      const m = d.mattina.asciutta, p = d.pomeriggio.asciutta, scelta = mie[d.giorno];
      const b = (val, testo, sub, ok) => `<button data-valore="${val}" aria-pressed="${scelta === val && ok}" ${ok ? '' : 'disabled'}>${esc(testo)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
      return `<div class="giorno-risp">${esc(GGL[dk(d.giorno).getUTCDay()])} ${esc(fmtG(d.giorno, false))}${d.coppia && g.tipo === 'COPPIA' ? ' <span class="etic">2 pallet</span>' : ''}</div>
        <div class="scelta risposta" data-gruppo="${esc(d.giorno)}">
          ${b('MATTINA', 'Mattina', m ? fasciaBreve(sbn.soglie.mattina) : 'pioggia', m)}
          ${b('POMERIGGIO', 'Pomeriggio', p ? (d.tramonto ? 'luce fino alle ' + d.tramonto : fasciaBreve(sbn.soglie.pomeriggio)) : 'pioggia', p)}
          ${b('ENTRAMBE', 'Tutti e due', '', m && p)}
          ${b('NO', 'Non ci sono', '', true)}</div>`;
    }).join('');
    const nota = (g.risposte.find(r => r.persona === S.io.nome) || {}).nota || '';
    const r = await chiedi({
      titolo: 'Ci sei per sbancalare?',
      testo: 'Rispondi per ogni giorno, anche solo «Non ci sono»: così gli altri sanno su chi contare.',
      html: html + `<label class="campo"><span>Nota per Francesco (facoltativa)</span>
        <input type="text" data-campo="nota" maxlength="120" placeholder="Es. io potrei anche venerdì pomeriggio" value="${esc(nota)}"></label>
        <p class="fonte">Proposti in base alle previsioni meteo · Open-Meteo.com</p>`,
      si: 'Invia',
      valida: x => futuri.every(d => x[d.giorno]) ? '' : 'Rispondi per ogni giorno, anche solo «Non ci sono».'
    });
    if (!r) return;
    const risposte = {};
    futuri.forEach(d => { risposte[d.giorno] = r[d.giorno]; });
    await azioneOnline('sbancRisposta', { giro: g.id, risposte, nota: String(r.nota || '').trim() }, 'Risposta inviata ✓');
  },
  sbancChiudi(el) { ls.set(K.sbChiuso, el.dataset.id); disegna(); },
  async sbancAggiungi() {
    const g = (vista().sbancalamento || {}).giro;
    if (!g || !g.deciso) return;
    if (!(await chiedi({ titolo: 'Ci sei anche tu?', testo: giornoMeseL(g.deciso.giorno) + ' ' + RISP_NOMI[g.deciso.fascia] + '. Gli altri lo vedono nell\'app.', si: 'Ci sono anch\'io' }))) return;
    await azioneOnline('sbancAggiungi', { giro: g.id }, 'Grazie! Ci sei anche tu ✓');
  },
  async sbancConta() {
    const i = $('#sbContati');
    const val = i ? String(i.value || '').trim() : '';
    if (!/^\d{1,3}$/.test(val) || Number(val) > 500) return toast('Scrivi il numero di sacchi interi (da 0 a 500).', 'avviso');
    const v = vista(), n = Number(val), prima = v.sacchi.locale, diff = n - prima;
    if (!(await chiedi({
      titolo: diff === 0 ? 'I conti tornano 👍' : 'Registro la conta?',
      testo: diff === 0 ? 'Risultano proprio ' + sacchiTesto(prima) + '.' : 'Risultano ' + sacchiTesto(prima) + ', tu ne hai contati ' + n + ': ' + sacchiTesto(Math.abs(diff)) + (diff < 0 ? ' in meno' : ' in più') + '. Francesco riceve un avviso.',
      si: 'Registra'
    }))) return;
    const op = { id: uuid(), azione: 'conta', sacchi: n, quando: new Date().toISOString(), codice: codice(), chi: S.io.nome };
    await accoda(op);
    if (coda().some(o => o.id === op.id)) toast('Niente campo: la conta è salvata sul telefono e partirà da sola.', 'avviso', 6000);
    else toast('Conta registrata ✓ Ora puoi registrare il pallet.', 'ok');
  },
  async sbancFissa() {
    const sbn = vista().sbancalamento || {};
    const oggi = oggiK(), d = sbn.date || {};
    const r = await chiedi({
      titolo: 'Fissa il giorno dello sbancalamento',
      testo: 'Sostituisce la proposta in corso (o il giorno già deciso) e avvisa tutti. Gli altri si aggiungono con «Ci sono anch\'io».',
      html: `<label class="campo"><span>Giorno</span><input type="date" data-campo="giorno" min="${oggi}" value="${esc(d.coppia && d.coppia > oggi ? d.coppia : addG(oggi, 1))}"></label>
        <div class="campo"><span>Quando</span><div class="scelta due" data-gruppo="fascia">
          <button data-valore="MATTINA" aria-pressed="true">Mattina<br><small>${esc(fasciaBreve(sbn.soglie ? sbn.soglie.mattina : ''))}</small></button>
          <button data-valore="POMERIGGIO" aria-pressed="false">Pomeriggio<br><small>${esc(fasciaBreve(sbn.soglie ? sbn.soglie.pomeriggio : ''))}</small></button></div></div>
        ${d.chiusura ? `<p class="tenue piccolo">Il locale basta fino a ${esc(GGL[dk(d.chiusura).getUTCDay()])} ${esc(fmtG(d.chiusura, false))} circa.</p>` : ''}`,
      si: 'Fissa',
      valida: x => !/^\d{4}-\d{2}-\d{2}$/.test(x.giorno || '') || x.giorno < oggi ? 'Scegli un giorno da oggi in poi.' : !x.fascia ? 'Scegli mattina o pomeriggio.' : ''
    });
    if (!r) return;
    await azioneOnline('sbancFissa', { giorno: r.giorno, fascia: r.fascia }, 'Giorno fissato: gli altri ricevono un avviso.');
  },
  notifiche() { bottoneNotifiche(); },
  /* Prova delle notifiche (1.5): "subito" o "chiusa" (dopo 15 minuti, ad app chiusa) */
  async prova(el) {
    const tipo = el.dataset.tipo;
    // ricontrolla la registrazione del telefono, ma senza aspettare più di 5 secondi
    // (se il service worker non è ancora pronto si resterebbe fermi qui)
    attesa(true, 'Preparo la prova…');
    try { await Promise.race([attivaNotifiche(), new Promise((_, no) => setTimeout(() => no(new Error('tempo')), 5000))]); }
    catch (e) { /* si prova lo stesso: lo script dirà se manca il telefono */ }
    finally { attesa(false); }
    const r = await azioneOnline('prova', { tipo });
    if (!r) return;
    if (/nessun telefono/i.test(r.esito || '')) toast('A tuo nome non risulta nessun telefono: tocca «Ricollega le notifiche» e riprova.', 'avviso', 7000);
    else if (/^ERRORE/.test(r.esito || '')) toast('Lo script non è riuscito a spedire la prova. Avvisa Francesco.', 'errore', 7000);
    else if (tipo === 'subito') toast('Prova inviata: arriva tra pochi secondi.', 'ok', 5000);
    else toast('Prova prenotata: arriverà tra 15 e 30 minuti. Ora chiudi l\'app e toglila dalle recenti.', 'ok', 8000);
  },
  async installa() {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => null);
    installPrompt = null; disegna();
  },
  async preferenze() {
    const ora = $('#prefOra').value || S.io.ora;
    if (ora < '07:00' || ora > '20:45') return toast('Scegli un orario tra le 7:00 e le 20:45: dopo le 21 le notifiche arrivano silenziose.', 'avviso', 6000);
    await azioneOnline('preferenze', {
      promemoria: $('#prefProm').checked, ora,
      preavviso: $('#prefPre').checked, giorni: Number($('#prefGiorni').value)
    }, 'Promemoria salvati ✓');
  },
  async esci() {
    if (coda().length) return toast('Ci sono ancora carichi da inviare: aspetta di avere campo.', 'avviso', 5000);
    if (!(await chiedi({ titolo: 'Collegare un\'altra persona?', testo: 'Questo telefono smetterà di essere collegato a ' + S.io.nome + '. Servirà un altro link personale.', si: 'Scollega', pericolo: true }))) return;
    ls.del(K.codice); ls.del(K.token); ls.del(K.tokenCod); S = null; ls.del(K.stato); pagina = 'oggi'; disegna();
  },
  salvaCodice() {
    const c = estraiCodice($('#campoCodice').value);
    if (!c) return toast('Non riconosco il link: incollalo per intero.', 'avviso');
    impostaCodice(c); pagina = 'oggi'; disegna(); aggiorna().then(dopoCollegamento);
  }
};
function leggiCampiInd() {
  const d = $('#indDal'), a = $('#indAl'), n = $('#indNota');
  if (d) ui.ind = { dal: d.value, al: a.value, nota: n.value.trim() };
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-az]');
  if (!el || el.tagName === 'INPUT') return;
  e.preventDefault();
  const f = azioni[el.dataset.az];
  if (f) f(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('input[data-az]');
  if (el && azioni[el.dataset.az]) azioni[el.dataset.az](el);
  if (['indDal', 'indAl'].includes(e.target.id)) {
    leggiCampiInd();
    if (e.target.id === 'indDal' && (!ui.ind.al || ui.ind.al < ui.ind.dal)) { ui.ind.al = ui.ind.dal; const a = $('#indAl'); if (a) a.value = ui.ind.dal; }
    if (ui.anteprima) { ui.anteprima = null; disegna(); }
  }
});

/* =====================================================================
 *  AVVIO
 * ===================================================================== */
function leggiCodiceDaIndirizzo() {
  const u = new URL(location.href);
  const c = u.searchParams.get('c');
  if (c === null) return;
  const pulito = estraiCodice(c);
  if (pulito) impostaCodice(pulito);
  u.searchParams.delete('c');
  history.replaceState(null, '', u.pathname + u.search + u.hash);
}
function dopoCollegamento() {
  // se il permesso c'è già, rinnova il token in silenzio
  if (S && 'Notification' in window && Notification.permission === 'granted') attivaNotifiche().catch(() => {}).finally(disegnaTestata);
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; disegna(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('App installata ✓', 'ok'); disegna(); });
window.addEventListener('online', () => { senzaRete = false; aggiorna({ silenzioso: true }); });
window.addEventListener('offline', () => { senzaRete = true; disegnaTestata(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - statoOra > 60000) aggiorna({ silenzioso: true });
});
setInterval(() => {
  if (document.visibilityState === 'visible' && (coda().length || Date.now() - statoOra > 5 * 60000)) aggiorna({ silenzioso: true });
}, 60000);

leggiCodiceDaIndirizzo();
if (/^#(pulizia|turni|pellet|caldaia|oggi)$/.test(location.hash)) {             // 1.6: aperta da una notifica
  pagina = location.hash.slice(1);
  history.replaceState(null, '', location.pathname + location.search);
}
window.addEventListener('hashchange', () => {
  if (/^#(pulizia|turni|pellet|caldaia|oggi)$/.test(location.hash)) { pagina = location.hash.slice(1); history.replaceState(null, '', location.pathname + location.search); disegna(); scrollTo(0, 0); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if (d.tipo === 'apri' && /^[a-z]+$/.test(d.pagina || '')) { pagina = d.pagina; disegna(); scrollTo(0, 0); aggiorna({ silenzioso: true }); }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
disegna();
aggiorna({ silenzioso: !!S }).then(dopoCollegamento);
</script>
</body>
</html>
